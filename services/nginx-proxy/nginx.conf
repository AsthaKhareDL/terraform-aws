events {}

http {
    resolver 169.254.169.253 valid=10s ipv6=off;

    server {
        listen 80;

        location /nginx1 {
            set $backend "internal-terraform-internal-alb-1714328288.us-east-1.elb.amazonaws.com";

            proxy_pass http://$backend;

            proxy_set_header Host nginx1.test.local;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx2 {
            set $backend "internal-terraform-internal-alb-1714328288.us-east-1.elb.amazonaws.com";

            proxy_pass http://$backend;

            proxy_set_header Host nginx2.test.local;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}