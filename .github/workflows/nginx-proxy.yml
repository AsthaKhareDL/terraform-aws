
name: Nginx Proxy

on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy Nginx Proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build proxy image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nginx-proxy:${{ steps.vars.outputs.IMAGE_TAG }} \
            ./services/nginx-proxy

      - name: Push proxy image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nginx-proxy:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Terraform Init
        working-directory: terraform/nginx-proxy
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/nginx-proxy
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ steps.vars.outputs.IMAGE_TAG }}"
```
