name: Nginx Backend

on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy Nginx Backend
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nginx-backend:${{ steps.vars.outputs.IMAGE_TAG }} \
            ./services/nginx-backend


      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nginx-backend:${{ steps.vars.outputs.IMAGE_TAG }}
            
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/nginx-backend
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/nginx-backend
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ steps.vars.outputs.IMAGE_TAG }}"